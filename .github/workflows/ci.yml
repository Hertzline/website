# Website CI (HZ-040--HZ-043). Actions pinned to commit SHAs (REPOS.md / RULES.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Astro 7 requires >=22.23.4; pin LTS 24 to match local verified npm ci.
        node: ["24"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build (static)
        run: npm run build

      - name: HZ-040 static scaffold checks
        run: npm run check:hz040

      - name: HZ-041 design system checks
        run: npm run check:hz041

      - name: HZ-042 i18n missing-key checks
        run: npm run check:hz042

      - name: Link checker
        run: npm run check:links

      - name: Accessibility structural checks
        run: npm run check:a11y

      - name: HZ-043 CI wiring checks
        run: npm run check:hz043

      - name: HZ-044 product pages checks
        run: npm run check:hz044

      - name: HZ-045 actions catalog checks
        run: npm run check:hz045

      - name: HZ-046 download page checks
        run: npm run check:hz046

      - name: Setup Chrome (Lighthouse)
        if: runner.os == 'Linux'
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome

      - name: Lighthouse CI (mobile >=95 all categories)
        if: runner.os == 'Linux'
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run check:lhci
