<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Hertzline Home preview</title>
  <desc id="desc">Product preview of the Home dashboard with health score and stats. Illustrated UI, not a live capture.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f8f6"/>
      <stop offset="100%" stop-color="#eef2f0"/>
    </linearGradient>
  </defs>
  <rect width="720" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="720" height="64" fill="#f7faf8" stroke="#c5d2cb"/>
  <text x="28" y="40" fill="#14201a" font-family="Instrument Sans, Segoe UI, sans-serif" font-size="22" font-weight="700">Hertzline</text>
  <text x="150" y="40" fill="#3d5248" font-family="Instrument Sans, Segoe UI, sans-serif" font-size="13">Misura, ottimizza, verifica</text>
  <rect x="430" y="22" width="78" height="22" rx="3" fill="#e8f1ec" stroke="#0f6b4c"/>
  <text x="469" y="37" text-anchor="middle" fill="#0f6b4c" font-family="IBM Plex Mono, monospace" font-size="11">1 Misura</text>
  <rect x="516" y="22" width="86" height="22" rx="3" fill="#fff" stroke="#c5d2cb"/>
  <text x="559" y="37" text-anchor="middle" fill="#3d5248" font-family="IBM Plex Mono, monospace" font-size="11">2 Ottimizza</text>
  <rect x="610" y="22" width="82" height="22" rx="3" fill="#fff" stroke="#c5d2cb"/>
  <text x="651" y="37" text-anchor="middle" fill="#3d5248" font-family="IBM Plex Mono, monospace" font-size="11">3 Verifica</text>
  <rect x="0" y="64" width="160" height="356" fill="#f7faf8" stroke="#c5d2cb"/>
  <rect x="16" y="88" width="128" height="32" rx="4" fill="#0f6b4c"/>
  <text x="80" y="109" text-anchor="middle" fill="#f4fbf7" font-family="Instrument Sans, Segoe UI, sans-serif" font-size="13" font-weight="600">Inizio</text>
  <text x="28" y="148" fill="#14201a" font-family="Instrument Sans, Segoe UI, sans-serif" font-size="13">Misura</text>
  <text x="28" y="176" fill="#14201a" font-family="Instrument Sans, Segoe UI, sans-serif" font-size="13">Verifica</text>
  <text x="28" y="204" fill="#14201a" font-family="Instrument Sans, Segoe UI, sans-serif" font-size="13">Ottimizza</text>
  <text x="28" y="232" fill="#3d5248" font-family="Instrument Sans, Segoe UI, sans-serif" font-size="13">Profili</text>
  <rect x="184" y="88" width="512" height="300" rx="4" fill="#f7faf8" stroke="#c5d2cb"/>
  <circle cx="280" cy="210" r="70" fill="none" stroke="#c5d2cb" stroke-width="14"/>
  <circle cx="280" cy="210" r="70" fill="none" stroke="#0f6b4c" stroke-width="14" stroke-dasharray="330" stroke-dashoffset="70" transform="rotate(-90 280 210)"/>
  <text x="280" y="205" text-anchor="middle" fill="#14201a" font-family="IBM Plex Mono, monospace" font-size="28" font-weight="700">78%</text>
  <text x="280" y="228" text-anchor="middle" fill="#3d5248" font-family="Instrument Sans, Segoe UI, sans-serif" font-size="11" letter-spacing="1">SALUTE</text>
  <text x="390" y="130" fill="#14201a" font-family="Instrument Sans, Segoe UI, sans-serif" font-size="16" font-weight="700">Prossimo passo</text>
  <text x="390" y="156" fill="#3d5248" font-family="Instrument Sans, Segoe UI, sans-serif" font-size="13">Score da indicatori reali. Nessun FPS inventato.</text>
  <rect x="390" y="176" width="120" height="34" rx="4" fill="#0f6b4c"/>
  <text x="450" y="198" text-anchor="middle" fill="#f4fbf7" font-family="Instrument Sans, Segoe UI, sans-serif" font-size="13" font-weight="600">1. Misura ora</text>
  <rect x="520" y="176" width="110" height="34" rx="4" fill="#fff" stroke="#c5d2cb"/>
  <text x="575" y="198" text-anchor="middle" fill="#14201a" font-family="Instrument Sans, Segoe UI, sans-serif" font-size="13">2. Ottimizza</text>
  <rect x="390" y="236" width="130" height="64" rx="4" fill="#fff" stroke="#c5d2cb"/>
  <text x="404" y="258" fill="#3d5248" font-family="Instrument Sans, Segoe UI, sans-serif" font-size="11">CPU top</text>
  <text x="404" y="282" fill="#14201a" font-family="IBM Plex Mono, monospace" font-size="18" font-weight="600">12%</text>
  <rect x="530" y="236" width="130" height="64" rx="4" fill="#fff" stroke="#c5d2cb"/>
  <text x="544" y="258" fill="#3d5248" font-family="Instrument Sans, Segoe UI, sans-serif" font-size="11">Temp CPU</text>
  <text x="544" y="282" fill="#14201a" font-family="IBM Plex Mono, monospace" font-size="18" font-weight="600">61 C</text>
  <rect x="390" y="310" width="130" height="52" rx="4" fill="#fff" stroke="#c5d2cb"/>
  <text x="404" y="332" fill="#3d5248" font-family="Instrument Sans, Segoe UI, sans-serif" font-size="11">Pulizia</text>
  <text x="404" y="352" fill="#14201a" font-family="IBM Plex Mono, monospace" font-size="16" font-weight="600">1.2 GiB</text>
  <rect x="530" y="310" width="130" height="52" rx="4" fill="#fff" stroke="#c5d2cb"/>
  <text x="544" y="332" fill="#3d5248" font-family="Instrument Sans, Segoe UI, sans-serif" font-size="11">Avvio</text>
  <text x="544" y="352" fill="#14201a" font-family="IBM Plex Mono, monospace" font-size="16" font-weight="600">4 attivi</text>
</svg>
