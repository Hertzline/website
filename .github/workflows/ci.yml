# Website scaffold CI (HZ-040). Full a11y/Lighthouse/i18n gates land in HZ-043.
# Actions pinned to commit SHAs (REPOS.md / RULES.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Astro 7 requires >=22.23.4; pin LTS 24 to match local verified npm ci.
        node: ["24"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build (static)
        run: npm run build

      - name: HZ-040 static scaffold checks
        run: npm run check:hz040
